name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: bundle sanity (shipped UI actually present)
        run: |
          BUNDLE=$(ls dist/assets/index-*.js)
          for m in "The loom decides" "How it works" "Parts list" "Your numbers" "How we got these numbers" "Water hygiene (legionella)"; do
            grep -q "$m" "$BUNDLE" || { echo "MISSING FROM BUNDLE: $m"; exit 1; }
          done
      - name: build stamp matches the source (live-drift depends on it)
        run: |
          expected=$(node scripts/build-id.mjs)
          grep -q "name=\"heatloom-build\" content=\"$expected\"" dist/index.html \
            || { echo "dist/index.html is not stamped with $expected"; grep -o 'name="heatloom-build"[^>]*' dist/index.html || true; exit 1; }
