name: live-drift
# Does heatloom.com serve what `main` says? The site is published from Bolt,
# so a merge does not deploy it; in September 2026 the live site was found a
# commit behind main. Each build stamps
# <meta name="heatloom-build" content="…"> with a hash of the shipped source
# (scripts/build-id.mjs); this job compares that stamp with main's and fails,
# which emails the repo owner, when they differ. GitHub disables scheduled
# workflows in public repos after 60 days without repository activity; re-enable
# it from the Actions tab if that happens.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compare live build stamp with main
        run: |
          expected=$(node scripts/build-id.mjs)
          if ! page=$(curl -fsSL --retry 3 https://heatloom.com/); then
            echo "::error::Could not fetch heatloom.com (site down or unreachable). This is not a drift result."
            exit 1
          fi
          live=$(printf '%s' "$page" \
            | grep -o 'name="heatloom-build" content="[^"]*"' \
            | sed 's/.*content="\([^"]*\)"/\1/' || true)
          echo "main:  $expected"
          echo "live:  ${live:-<no stamp>}"
          if [ "$live" = "unknown" ]; then
            echo "::error::heatloom.com's build could not compute its stamp (scripts/build-id.mjs missing or failing in Bolt's build?). Republishing alone will not fix this."
            exit 1
          fi
          if [ "$live" != "$expected" ]; then
            echo "::error::heatloom.com is not serving main (live ${live:-<no stamp>}, main $expected). Pull main into Bolt and publish."
            exit 1
          fi
          echo "heatloom.com matches main."
